<div id="bootDiagnostics" hidden role="alert" aria-live="assertive" style="position:fixed;right:14px;bottom:14px;z-index:3000;width:min(500px,calc(100vw - 28px));background:#fff8ed;color:#6d330d;border:1px solid #eab98c;border-radius:12px;padding:14px 16px;box-shadow:0 14px 45px #071c3130;font:14px/1.5 system-ui,sans-serif;white-space:pre-line"></div>
<script>
/* v3.11.0: surface load failures even when the main JS has not started. */
(function(){
  const messages=[];
  const paint=()=>{
    const node=document.getElementById('bootDiagnostics');if(!node)return;
    node.hidden=!messages.length;
    node.textContent=messages.length?'Uygulama dosyası kontrolü\n'+messages.join('\n')+'\nGitHub dosya yollarını kontrol edin; ardından sayfayı önbelleksiz yenileyin.':'';
  };
  window.erulesBootReport=(message)=>{if(!messages.includes(message)){messages.push(message);paint();}};
  window.addEventListener('error',evt=>{
    if(evt.target?.tagName==='SCRIPT' && evt.target.src && !evt.target.src.includes('/config.js')){
      window.erulesBootReport('Yüklenemeyen dosya: '+new URL(evt.target.src).pathname);
    }
  },true);
  window.addEventListener('DOMContentLoaded',paint,{once:true});
  setTimeout(()=>{
    if(!window.ERULES_APP_EVENTS_READY)window.erulesBootReport('Uygulama başlatılamadı. src/app.js ve diğer JavaScript modüllerini kontrol edin.');
    else if(window.ERULES_APP_BUILD!=='3.11.0')window.erulesBootReport('Dosya sürümleri uyuşmuyor: index.html v3.11.0, src/app.js '+(window.ERULES_APP_BUILD||'eski sürüm')+'. GitHub dosyalarını eşitleyin.');
  },3500);
})();
</script>
<script>
/* Always fetch the latest shared Firebase Web App config. This is a tiny public
   file, not a secret; a fresh URL avoids stale blank config on mobile devices. */
window.EASA_CONFIG_READY = new Promise(resolve => {
  const element = document.createElement('script');
  element.src = './config.js?loaded=' + Date.now();
  element.onload = () => resolve(true);
  element.onerror = () => { console.warn('config.js yüklenemedi; yerel ayarlar kontrol edilecek.'); resolve(false); };
  document.head.appendChild(element);
});
</script>
<script src="./src/parser.js?v=3.11.0"></script>
<script src="./src/clauses.js?v=3.11.0"></script>
<script>
/* Avoid silently interpreting Turkish a) / 1) clauses with an old EASA-only reader. */
(function(){
  try {
    const test = [
      {t:'(1) Deneme fıkrası',level:0},
      {t:'a) Deneme bendi',level:1},
      {t:'1) Deneme alt bendi',level:2}
    ];
    const found = window.EasaClauses?.outline?.(test)?.filter(n=>n.type==='clause')||[];
    if(found.length!==3 || found[0].level!==0 || found[1].level!==1 || found[2].level!==2 || found[2].anchor!=='1/a/1'){
      window.erulesBootReport?.('src/clauses.js eski veya eksik. v3.11.0 eksiksiz paketiyle dosyaları eşitleyin.');
    }
  } catch(err) {window.erulesBootReport?.('src/clauses.js doğrulama hatası: '+(err?.message||err));}
})();
</script>
